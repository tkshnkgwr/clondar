name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: clondar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: clondar

      - name: Checkout common_lib
        uses: actions/checkout@v7
        with:
          repository: tkshnkgwr/common_lib
          path: common_lib
          token: ${{ secrets.PAT || github.token }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'clondar -> clondar/target'

      - name: Build release binary
        run: cargo build --release

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $makensis = $c; break }
            }
          } else {
            $makensis = $makensis.Source
          }
          if (-not $makensis) {
            choco install nsis -y
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis "installer/clondar.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            clondar/installer/*.exe
            clondar/target/release/Clondar.exe
          tag_name: ${{ github.ref_name }}
          name: 'Clondar Pro ${{ github.ref_name }}'
          body: 'Please refer to `docs/en/CHANGELOG.md` (or `docs/ja/CHANGELOG.md`) for details of this release.'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
